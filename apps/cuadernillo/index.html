<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuadernillo 2026 · Poder Judicial de San Juan</title>
<style>
  :root{
    --ink:#111a24;
    --panel:#16212e;
    --panel-2:#1c2938;
    --line: #2b3a4a;
    --paper:#f4f1e9;
    --brass:#c69a3a;
    --brass-dim:#8a6e28;
    --good:#3f8f5f;
    --good-bg:#173325;
    --bad:#c1543a;
    --bad-bg:#3a2019;
    --text:#e9e6dc;
    --text-dim:#a9b3bd;
    --radius:2px;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;margin-bottom:28px;
    gap:12px;flex-wrap:wrap;
  }
  header.top .mark{
    font-family:var(--serif);
    font-size:1.55rem;
    letter-spacing:.2px;
    color:var(--paper);
  }
  header.top .mark small{
    display:block;font-family:var(--sans);font-size:.72rem;color:var(--brass);
    letter-spacing:.12em;margin-top:4px;font-weight:600;
  }
  .backlink{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    font-family:var(--sans);font-size:.85rem;padding:8px 14px;border-radius:var(--radius);
    cursor:pointer;
  }
  .backlink:hover{border-color:var(--brass);color:var(--paper);}

  /* HOME */
  .lede{
    font-family:var(--serif);font-size:1.25rem;line-height:1.55;color:var(--paper);
    max-width:62ch;margin:0 0 30px;
  }
  .lede em{color:var(--brass);font-style:normal;}

  .exam-cta{
    display:flex;gap:22px;align-items:center;
    background:linear-gradient(135deg,var(--panel-2),var(--panel));
    border:1px solid var(--brass-dim);
    border-radius:var(--radius);
    padding:22px 26px;margin-bottom:34px;
    flex-wrap:wrap;
  }
  .exam-cta .num{
    font-family:var(--serif);font-size:2.6rem;color:var(--brass);line-height:1;
  }
  .exam-cta .info{flex:1;min-width:220px;}
  .exam-cta h2{margin:0 0 6px;font-family:var(--serif);font-size:1.25rem;color:var(--paper);font-weight:normal;}
  .exam-cta p{margin:0;color:var(--text-dim);font-size:.92rem;}
  .exam-cta .stats{display:flex;gap:18px;margin-top:10px;font-size:.82rem;color:var(--text-dim);}
  .exam-cta .stats b{color:var(--paper);}

  .btn{
    font-family:var(--sans);font-size:.92rem;font-weight:600;
    background:var(--brass);color:#1a1305;border:none;
    padding:12px 22px;border-radius:var(--radius);cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:#d9ac47;}
  .btn.secondary{
    background:transparent;border:1px solid var(--line);color:var(--paper);
  }
  .btn.secondary:hover{border-color:var(--brass);color:var(--brass);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .section-title{
    font-family:var(--serif);color:var(--paper);font-size:1.05rem;
    margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }

  .tema-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .tema-card{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;
  }
  .tema-card .roman{
    font-family:var(--serif);font-size:1.4rem;color:var(--brass-dim);width:2.4em;flex-shrink:0;text-align:center;
  }
  .tema-card .body{flex:1;min-width:160px;}
  .tema-card h3{margin:0 0 3px;font-size:.98rem;font-weight:600;color:var(--paper);}
  .tema-card .meta{font-size:.78rem;color:var(--text-dim);}
  .tema-card .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select.count-select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 8px;font-family:var(--sans);font-size:.82rem;
  }

  footer.note{margin-top:40px;color:var(--text-dim);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px;}

  /* QUIZ */
  .quiz-head{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .progress-wrap{flex:1;min-width:180px;}
  .progress-label{font-size:.78rem;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between;}
  .progress-bar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--brass);transition:width .2s;}
  .timer{
    font-family:var(--serif);font-size:1.7rem;color:var(--paper);
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 18px;min-width:110px;text-align:center;
  }
  .timer.low{color:var(--bad);border-color:var(--bad);}

  .q-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 26px 20px;margin-bottom:20px;
  }
  .q-tema-tag{
    font-size:.72rem;letter-spacing:.05em;color:var(--brass);text-transform:uppercase;margin-bottom:10px;
  }
  .q-text{font-family:var(--serif);font-size:1.18rem;color:var(--paper);line-height:1.5;margin:0 0 22px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 16px;margin-bottom:10px;
    color:var(--text);font-family:var(--sans);font-size:.94rem;cursor:pointer;
  }
  .opt:hover{border-color:var(--brass-dim);}
  .opt .letter{
    font-family:var(--serif);color:var(--brass);flex-shrink:0;width:1.2em;
  }
  .opt.selected{border-color:var(--brass);background:#26201040;}
  .opt.correct{border-color:var(--good);background:var(--good-bg);}
  .opt.incorrect{border-color:var(--bad);background:var(--bad-bg);}
  .opt:disabled{cursor:default;}
  .exp{
    margin-top:14px;padding:12px 14px;background:var(--panel-2);border-left:3px solid var(--brass);
    font-size:.87rem;color:var(--text-dim);border-radius:0 var(--radius) var(--radius) 0;
  }
  .quiz-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* RESULTS */
  .result-hero{
    text-align:center;padding:36px 20px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:28px;
  }
  .result-hero .verdict{
    font-family:var(--serif);font-size:2.2rem;margin:0 0 8px;
  }
  .verdict.pass{color:var(--good);}
  .verdict.fail{color:var(--bad);}
  .result-hero .score{font-size:1.05rem;color:var(--text-dim);}
  .result-hero .score b{color:var(--paper);font-size:1.3rem;}
  .result-bars{display:flex;justify-content:center;gap:26px;margin-top:20px;flex-wrap:wrap;}
  .result-bars .stat{text-align:center;}
  .result-bars .stat .n{font-family:var(--serif);font-size:1.6rem;color:var(--paper);}
  .result-bars .stat .l{font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}

  .review-item{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:10px;
  }
  .review-item.wrong{border-left:3px solid var(--bad);}
  .review-item.right{border-left:3px solid var(--good);}
  .review-item .rq{font-size:.95rem;color:var(--paper);margin-bottom:8px;}
  .review-item .ra{font-size:.85rem;color:var(--text-dim);margin:2px 0;}
  .review-item .ra.correctline{color:var(--good);}
  .review-item .ra.wrongline{color:var(--bad);}
  .result-actions{display:flex;gap:10px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap;}

  .hidden{display:none !important;}

  /* TEORIA */
  .theory-lead{
    font-family:var(--serif);font-size:1.12rem;color:var(--paper);line-height:1.55;
    margin:0 0 22px;
  }
  .theory-list{list-style:none;margin:0 0 34px;padding:0;}
  .theory-list li{
    position:relative;padding:12px 16px 12px 34px;margin-bottom:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--text);font-size:.92rem;line-height:1.55;
  }
  .theory-list li::before{
    content:"\2022";color:var(--brass);position:absolute;left:14px;top:11px;font-size:1.1rem;
  }
  .video-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:10px;}
  .video-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .video-card .frame-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .video-card .frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .video-card .vinfo{padding:12px 16px;}
  .video-card .vinfo .vtitle{font-size:.9rem;color:var(--paper);margin:0 0 6px;line-height:1.4;}
  .video-card .vinfo a{color:var(--brass);font-size:.8rem;text-decoration:none;}
  .video-card .vinfo a:hover{text-decoration:underline;}
  .resource-card{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;margin-bottom:12px;
  }
  .resource-card .rtitle{font-size:.9rem;color:var(--paper);}
  .resource-card .rtag{
    display:inline-block;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;
    color:var(--brass);margin-bottom:4px;
  }
  .resource-card a.btn{padding:8px 16px;font-size:.82rem;white-space:nowrap;text-decoration:none;display:inline-block;}
  .tema-card .controls{row-gap:8px;}

  @media (max-width:600px){
    .tema-card{flex-wrap:wrap;}
    .exam-cta{flex-direction:column;align-items:flex-start;}
  }
</style>

<script>
const TEMAS = {"1": "Derecho Constitucional", "2": "Constitución Provincial de San Juan", "3": "Organización del Poder Judicial de San Juan", "4": "Ministerio Público y Defensa Oficial", "5": "Derecho Civil y Procesal Civil", "6": "Derecho Laboral y Procesal Laboral", "7": "Derecho de las Familias y Proceso de Familia", "8": "Derecho Penal y Procesal Penal", "9": "Normativa de Género"};

const TEORIA = {
  1: {
    lead: "El Derecho Constitucional estudia la Constitución como norma suprema: cómo organiza el poder del Estado y qué derechos garantiza a las personas.",
    puntos: [
      "Constitución formal (el texto escrito) y Constitución material (cómo funciona realmente el poder en la práctica).",
      "Poder constituyente originario (funda el Estado) y derivado (lo reforma); una Constitución es rígida cuando su reforma exige un procedimiento distinto al de las leyes comunes.",
      "Supremacía constitucional (art. 31 CN): la Constitución, las leyes que la reglamentan y los tratados están por encima del resto del ordenamiento jurídico.",
      "Control de constitucionalidad: los jueces pueden declarar inaplicable una norma que contradiga la Constitución.",
      "La reforma de 1994 incorporó tratados de derechos humanos con jerarquía constitucional (art. 75 inc. 22), el Ministerio Público como órgano independiente (art. 120) y la autonomía de la Ciudad de Buenos Aires, entre otros cambios."
    ],
    recursos: [
      {tipo:"video", titulo:"Introducción al Derecho Constitucional (Constitución Nacional Argentina)", url:"https://www.youtube.com/watch?v=mictl6pKTq8"},
      {tipo:"video", titulo:"Supremacía y jerarquía constitucional", url:"https://www.youtube.com/watch?v=h3c_n7bSYaU"}
    ]
  },
  2: {
    lead: "Cada provincia argentina dicta su propia Constitución (arts. 5, 121 a 123 CN): es un poder constituyente 'de segundo grado', condicionado por la Constitución Nacional.",
    puntos: [
      "La Constitución de San Juan fue sancionada en 1986 y tuvo reformas posteriores (por ejemplo, el art. 175 fue modificado por la Ley 8199 del año 2001).",
      "Organiza los tres poderes provinciales: Poder Ejecutivo (Gobernador/a), Poder Legislativo (Cámara de Diputados, de composición unicameral) y Poder Judicial.",
      "Contiene su propia declaración de derechos y garantías para los habitantes de la provincia, además de los que ya reconoce la Constitución Nacional.",
      "Crea organismos de control propios, como la Fiscalía de Estado y el Tribunal de Cuentas.",
      "Debe respetar el sistema representativo, republicano y federal, y asegurar la administración de justicia, el régimen municipal y la educación primaria, tal como exige el art. 5 de la Constitución Nacional."
    ],
    recursos: [
      {tipo:"video", titulo:"Constituciones Provinciales: qué son y qué regulan", url:"https://www.youtube.com/watch?v=mPFbiWOtvj8"},
      {tipo:"enlace", titulo:"Texto oficial de la Constitución de San Juan (PDF)", url:"https://www2.hcdn.gob.ar/export/hcdn/secparl/dgral_info_parlamentaria/dip/archivos/constitucion-sanjuan.pdf"}
    ]
  },
  3: {
    lead: "El Poder Judicial de San Juan administra justicia dentro de la provincia, con su propia estructura de tribunales y fueros.",
    puntos: [
      "La Corte de Justicia es el máximo tribunal provincial; actúa como última instancia y ejerce la superintendencia sobre el resto del Poder Judicial.",
      "Existen distintos fueros según la materia: civil, penal, laboral, de familia, entre otros, cada uno con juzgados y cámaras de apelación propias.",
      "Las causas suelen recorrer varias instancias: juzgados de primera instancia, cámaras de apelación y, en su caso, la Corte de Justicia.",
      "Un Consejo de la Magistratura interviene en la selección de jueces y juezas mediante concursos públicos de oposición y antecedentes.",
      "El Poder Judicial provincial es independiente de los poderes Ejecutivo y Legislativo, principio clave para garantizar imparcialidad en sus decisiones."
    ],
    recursos: [
      {tipo:"video", titulo:"Poder Judicial: esquema general (Constitución Nacional, Sección Tercera)", url:"https://www.youtube.com/watch?v=SHSByd2drEY"},
      {tipo:"video", titulo:"Estructura del Poder Judicial", url:"https://www.youtube.com/watch?v=Mja29Bvix7U"}
    ]
  },
  4: {
    lead: "El Ministerio Público es un órgano independiente de los tres poderes del Estado (art. 120 CN), con dos ramas: la Fiscal y la de la Defensa.",
    puntos: [
      "El Ministerio Público Fiscal promueve y ejerce la acción penal pública: investiga delitos y acusa en representación de la sociedad.",
      "El Ministerio Público de la Defensa (Defensa Oficial) garantiza el derecho de defensa en juicio, asistiendo gratuitamente a quienes no pueden pagar un abogado particular.",
      "A nivel nacional está encabezado por el Procurador/a General y el Defensor/a General; en San Juan existe una estructura equivalente dentro del Poder Judicial provincial.",
      "Sus integrantes gozan de inmunidades funcionales para actuar con independencia de criterio.",
      "La Defensa Oficial también interviene en materia civil, laboral y de familia, no solo en lo penal (por ejemplo, en alimentos, divorcios o sucesorios de personas sin recursos)."
    ],
    recursos: [
      {tipo:"canal", titulo:"Canal oficial: Ministerio Público de la Defensa de Argentina", url:"https://www.youtube.com/@mpdargentina/videos"},
      {tipo:"canal", titulo:"Canal oficial: Ministerio Público Fiscal (Procuración General)", url:"https://www.youtube.com/user/PGNcomunicacion"}
    ]
  },
  5: {
    lead: "El Derecho Civil regula las relaciones entre particulares; en Argentina se rige principalmente por el Código Civil y Comercial (Ley 26.994, vigente desde 2015).",
    puntos: [
      "Regula a la persona humana (capacidad, nombre, domicilio), los bienes, las obligaciones, los contratos, los derechos reales y las sucesiones.",
      "Incorporó principios como la buena fe, el abuso del derecho y la protección de la vivienda familiar.",
      "El Derecho Procesal Civil establece cómo se tramita un juicio: demanda, contestación, ofrecimiento y producción de prueba, alegatos, sentencia y recursos.",
      "Principios procesales clave: bilateralidad (ambas partes deben poder ser oídas), congruencia (el juez decide sobre lo pedido) y preclusión (las etapas del proceso no se repiten una vez cumplidas).",
      "Existen distintos tipos de procesos según la complejidad del asunto: ordinario, sumario/abreviado y ejecutivo, entre otros."
    ],
    recursos: [
      {tipo:"video", titulo:"El Código Civil y Comercial argentino: introducción", url:"https://www.youtube.com/watch?v=10adtfdgJTc"},
      {tipo:"video", titulo:"Estructura del nuevo Código Civil y Comercial de la Nación", url:"https://www.youtube.com/watch?v=6HKc8LYBdcY"}
    ]
  },
  6: {
    lead: "El Derecho Laboral regula la relación entre trabajadores y empleadores, principalmente a través de la Ley de Contrato de Trabajo (Ley 20.744).",
    puntos: [
      "Principio protectorio: ante la desigualdad entre las partes, la ley protege a la parte más débil de la relación, que es el trabajador.",
      "Irrenunciabilidad de derechos: el trabajador no puede renunciar válidamente a los derechos que la ley le reconoce.",
      "Primacía de la realidad: importa lo que ocurre efectivamente en los hechos, más allá de lo que digan los papeles o el contrato firmado.",
      "Derechos básicos: jornada limitada, descanso, vacaciones pagas, salario mínimo, indemnización por despido sin causa.",
      "El Derecho Procesal Laboral suele exigir una instancia de conciliación obligatoria antes del juicio, y tramita ante tribunales o juzgados del trabajo especializados."
    ],
    recursos: [
      {tipo:"video", titulo:"Principios del Derecho Laboral", url:"https://www.youtube.com/watch?v=9pWwP34ej2o"},
      {tipo:"video", titulo:"El Contrato de Trabajo (LCT): concepto, características y elementos", url:"https://www.youtube.com/watch?v=btvgKA8vM9s"}
    ]
  },
  7: {
    lead: "El Código Civil y Comercial habla de 'Derecho de las Familias', en plural, para reconocer la diversidad de formas familiares existentes hoy.",
    puntos: [
      "Regula el matrimonio, las uniones convivenciales, la filiación (por naturaleza, técnicas de reproducción humana asistida y adopción) y la responsabilidad parental.",
      "El interés superior del niño, niña o adolescente es el principio rector en todas las decisiones que los afectan.",
      "El proceso de familia tiene reglas propias: oralidad, inmediación (contacto directo del juez con las partes), informalidad relativa y actuación de oficio del juez en ciertos casos.",
      "Se busca resolver los conflictos familiares priorizando el diálogo y la mediación antes que la confrontación judicial.",
      "Incluye también el régimen de alimentos, cuidado personal de los hijos y régimen de comunicación (antes llamado 'régimen de visitas')."
    ],
    recursos: [
      {tipo:"video", titulo:"¿Qué es el Derecho de Familia? Fácil y con ejemplos", url:"https://www.youtube.com/watch?v=zJe2BaToue4"},
      {tipo:"video", titulo:"Derecho de Familia: introducción", url:"https://www.youtube.com/watch?v=XNG8EnlqjeQ"}
    ]
  },
  8: {
    lead: "El Derecho Penal define qué conductas son delitos y qué penas les corresponden; el Derecho Procesal Penal establece cómo se investiga y juzga a una persona.",
    puntos: [
      "Principio de legalidad: nadie puede ser penado sin una ley previa que establezca el delito y la pena (nullum crimen, nulla poena sine lege).",
      "Presunción de inocencia y derecho de defensa en juicio: toda persona se presume inocente hasta que una sentencia firme diga lo contrario.",
      "Sistema acusatorio: separa claramente las funciones de investigar y acusar (a cargo del fiscal) de la de juzgar (a cargo del juez), a diferencia del viejo sistema inquisitivo.",
      "Etapas típicas del proceso penal: investigación o instrucción, y juicio (oral y público en la mayoría de los sistemas modernos).",
      "San Juan, como la mayoría de las provincias, avanzó hacia un Código Procesal Penal de tipo acusatorio, con mayor protagonismo de fiscales y audiencias orales."
    ],
    recursos: [
      {tipo:"video", titulo:"Derecho Penal: ¿qué es? Todo explicado", url:"https://www.youtube.com/watch?v=--FbKFsEk1M"},
      {tipo:"video", titulo:"En 3 minutos: claves del régimen procesal penal (sistema acusatorio)", url:"https://www.youtube.com/watch?v=eGsmiC0VnOc"}
    ]
  },
  9: {
    lead: "La normativa de género establece el marco legal para prevenir, sancionar y erradicar la violencia y la discriminación por razones de género en Argentina.",
    puntos: [
      "Ley 26.485 de Protección Integral a las Mujeres: define los distintos tipos de violencia (física, psicológica, sexual, económica, simbólica) y las modalidades en que puede darse (doméstica, laboral, institucional, entre otras).",
      "Ley Micaela (27.499): obliga a capacitar en género y violencia contra las mujeres a todas las personas que se desempeñan en la función pública, en los tres poderes del Estado.",
      "Ley de Identidad de Género (26.743): reconoce el derecho de las personas a ser tratadas según su identidad autopercibida.",
      "Ley de Matrimonio Igualitario (26.618): permite el matrimonio entre personas del mismo sexo con los mismos derechos y obligaciones.",
      "El Poder Judicial debe incorporar la perspectiva de género al analizar los casos, evitando estereotipos y garantizando un acceso a la justicia libre de revictimización."
    ],

{"tema": 9, "q": "La violencia laboral contra las mujeres incluye, según la Ley 26.485:", "opts": ["Exigir test de embarazo o vulnerar la igual remuneración por igual tarea", "Solo el despido injustificado", "Únicamente el acoso sexual", "Solo la discriminación por antigüedad"], "correct": 0, "exp": ""}, {"tema": 9, "q": "El objeto de la Ley 26.485 incluye, entre otros fines:", "opts": ["La eliminación de la discriminación entre mujeres y varones y el acceso a la justicia de las mujeres que padecen violencia", "Regular exclusivamente el régimen patrimonial del matrimonio", "Sancionar únicamente delitos económicos", "Organizar el régimen electoral"], "correct": 0, "exp": ""}];

<script>
(function(){
  "use strict";

  const ROMAN = {1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX"};
  const app = document.getElementById('app');

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function countByTema(temaId){
    return QUESTIONS.filter(q=>q.tema===temaId).length;
  }

  // ---------------- STATE ----------------
  let quiz = null; // {mode, temaId, title, items:[{...question, order:[shuffled opt idx map]}], current, timeLeft, timerId, finished}

  function buildQuizItems(rawQuestions){
    // shuffle option order per question, keep track of correct index after shuffle
    return rawQuestions.map(q=>{
      const idxs = shuffle([0,1,2,3]);
      const opts = idxs.map(i=>q.opts[i]);
      const correct = idxs.indexOf(q.correct);
      return {
        tema:q.tema, qtext:q.q, exp:q.exp||"",
        opts, correct,
        selected:null, answered:false
      };
    });
  }

  function startTemaQuiz(temaId, count){
    const pool = QUESTIONS.filter(q=>q.tema===temaId);
    const n = count==='all' ? pool.length : Math.min(count, pool.length);
    const chosen = shuffle(pool).slice(0,n);
    quiz = {
      mode:'tema', temaId,
      title: 'Tema ' + ROMAN[temaId] + ' · ' + TEMAS[temaId],
      items: buildQuizItems(chosen),
      current:0, timeLeft:null, timerId:null, finished:false, examMinutes:null
    };
    renderQuiz();
  }

  function startExam(){
    const n = Math.min(100, QUESTIONS.length);
    const chosen = shuffle(QUESTIONS).slice(0,n);
    quiz = {
      mode:'exam', temaId:null,
      title:'Examen General · ' + n + ' preguntas',
      items: buildQuizItems(chosen),
      current:0, timeLeft:75*60, timerId:null, finished:false, examMinutes:75
    };
    startTimer();
    renderQuiz();
  }

  function startTimer(){
    stopTimer();
    quiz.timerId = setInterval(()=>{
      quiz.timeLeft--;
      updateTimerDisplay();
      if(quiz.timeLeft<=0){
        stopTimer();
        finishQuiz(true);
      }
    },1000);
  }
  function stopTimer(){
    if(quiz && quiz.timerId){ clearInterval(quiz.timerId); quiz.timerId=null; }
  }
  function fmtTime(s){
    const m = Math.floor(s/60), sec = s%60;
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function updateTimerDisplay(){
    const el = document.getElementById('timer-display');
    if(!el) return;
    el.textContent = fmtTime(Math.max(0,quiz.timeLeft));
    el.classList.toggle('low', quiz.timeLeft<=300);
  }

  // ---------------- RENDER: HOME ----------------
  function renderHome(){
    stopTimer();
    quiz = null;
    const totalQ = QUESTIONS.length;
    let temaCards = '';
    for(let t=1;t<=9;t++){
      const c = countByTema(t);
      const stepOptions = [10,20].filter(n=>n<c);
      let optionsHtml = stepOptions.map(n=>`<option value="${n}">${n} preguntas</option>`).join('');
      optionsHtml += `<option value="all" selected>Todas (${c})</option>`;
      temaCards += `
        <div class="tema-card">
          <div class="roman">${ROMAN[t]}</div>
          <div class="body">
            <h3>${TEMAS[t]}</h3>
            <div class="meta">${c} preguntas disponibles en el banco</div>
          </div>
          <div class="controls">
            <select class="count-select" data-tema="${t}">
              ${optionsHtml}
            </select>
            <button class="btn secondary" data-teoria="${t}">Teoría</button>
            <button class="btn secondary" data-practice="${t}">Practicar</button>
          </div>
        </div>`;
    }

    app.innerHTML = `
      <header class="top">
        <div class="mark">Cuadernillo 2026<small>Poder Judicial de San Juan &middot; Preparación de concurso</small></div>
      </header>

      <p class="lede">Estudiá los <em>${9} temas</em> del programa con su resumen teórico y videos cortos,
      practicá con preguntas aleatorias, o rendí el <em>examen general</em> en las mismas condiciones del
      juzgado: 100 preguntas, 75 minutos y 71 respuestas correctas para aprobar.</p>

      <div class="exam-cta">
        <div class="num">100</div>
        <div class="info">
          <h2>Examen General</h2>
          <p>Simulacro completo con preguntas de los nueve temas, mezcladas al azar.</p>
          <div class="stats">
            <span>&#9200; <b>75 min</b></span>
            <span>&#10003; <b>71/100</b> para aprobar</span>
            <span>&#128218; Banco de <b>${totalQ}</b> preguntas</span>
          </div>
        </div>
        <button class="btn" id="start-exam">Iniciar examen</button>
      </div>

      <div class="section-title">Práctica por tema</div>
      <div class="tema-grid">${temaCards}</div>

      <footer class="note">Contenido elaborado a partir del Cuadernillo 2026. Herramienta de estudio informal, sin validez oficial.</footer>
    `;

    document.getElementById('start-exam').addEventListener('click', startExam);
    app.querySelectorAll('[data-practice]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const t = parseInt(btn.getAttribute('data-practice'),10);
        const sel = app.querySelector(`select[data-tema="${t}"]`);
        const val = sel.value === 'all' ? 'all' : parseInt(sel.value,10);
        startTemaQuiz(t, val);
      });
    });
    app.querySelectorAll('[data-teoria]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const t = parseInt(btn.getAttribute('data-teoria'),10);
        renderTeoria(t);
      });
    });
  }

  // ---------------- RENDER: TEORIA ----------------
  function getYouTubeId(url){
    const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  function renderTeoria(t){
    stopTimer();
    const data = TEORIA[t];
    if(!data){ renderHome(); return; }

    const puntosHtml = data.puntos.map(p=>`<li>${p}</li>`).join('');

    const recursosHtml = data.recursos.map(r=>{
      if(r.tipo === 'video'){
        const vid = getYouTubeId(r.url);
        const frame = vid
          ? `<div class="frame-wrap"><iframe src="https://www.youtube.com/embed/${vid}" title="${r.titulo}" allowfullscreen loading="lazy"></iframe></div>`
          : '';
        return `<div class="video-card">
          ${frame}
          <div class="vinfo">
            <p class="vtitle">${r.titulo}</p>
            <a href="${r.url}" target="_blank" rel="noopener">Ver en YouTube &rarr;</a>
          </div>
        </div>`;
      }
      const tag = r.tipo === 'canal' ? 'Canal de YouTube' : 'Documento oficial';
      return `<div class="resource-card">
        <div><span class="rtag">${tag}</span><div class="rtitle">${r.titulo}</div></div>
        <a class="btn secondary" href="${r.url}" target="_blank" rel="noopener">Abrir</a>
      </div>`;
    }).join('');

    app.innerHTML = `
      <header class="top">
        <div class="mark">Teoría &middot; Tema ${ROMAN[t]}<small>${TEMAS[t]}</small></div>
        <button class="backlink" id="teoria-back">&larr; Volver</button>
      </header>

      <p class="theory-lead">${data.lead}</p>

      <div class="section-title">Ideas clave</div>
      <ul class="theory-list">${puntosHtml}</ul>

      <div class="section-title">Videos y recursos cortos</div>
      <div class="video-grid">${recursosHtml}</div>

      <div class="result-actions">
        <button class="btn secondary" id="teoria-back-2">Volver al inicio</button>
        <button class="btn" id="teoria-practicar">Practicar este tema</button>
      </div>

      <footer class="note">Resumen elaborado como guía de estudio informal a partir de normativa y fuentes públicas; no reemplaza la lectura del Cuadernillo 2026 ni de los textos legales originales.</footer>
    `;

    document.getElementById('teoria-back').addEventListener('click', renderHome);
    document.getElementById('teoria-back-2').addEventListener('click', renderHome);
    document.getElementById('teoria-practicar').addEventListener('click', ()=>{
      startTemaQuiz(t, 'all');
    });
  }

  // ---------------- RENDER: QUIZ ----------------
  function renderQuiz(){
    const item = quiz.items[quiz.current];
    const total = quiz.items.length;
    const pct = Math.round((quiz.current)/total*100);

    const timerHtml = quiz.mode==='exam'
      ? `<div class="timer" id="timer-display">${fmtTime(quiz.timeLeft)}</div>`
      : '';

    const optsHtml = item.opts.map((opt,i)=>{
      let cls = 'opt';
      if(item.answered){
        if(i===item.correct) cls+=' correct';
        else if(i===item.selected) cls+=' incorrect';
      } else if(item.selected===i){
        cls+=' selected';
      }
      return `<button class="${cls}" data-opt="${i}" ${item.answered?'disabled':''}>
        <span class="letter">${String.fromCharCode(97+i)})</span><span>${opt}</span>
      </button>`;
    }).join('');

    const expHtml = (item.answered && item.exp) ? `<div class="exp">${item.exp}</div>` : '';

    const isLast = quiz.current === total-1;
    const nextLabel = isLast ? 'Finalizar' : 'Siguiente pregunta';

    app.innerHTML = `
      <header class="top">
        <div class="mark">${quiz.title}</div>
        <button class="backlink" id="abandon">Abandonar</button>
      </header>

      <div class="quiz-head">
        <div class="progress-wrap">
          <div class="progress-label"><span>Pregunta ${quiz.current+1} de ${total}</span><span>${pct}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        ${timerHtml}
      </div>

      <div class="q-card">
        <div class="q-tema-tag">Tema ${ROMAN[item.tema]} &middot; ${TEMAS[item.tema]}</div>
        <p class="q-text">${item.qtext}</p>
        ${optsHtml}
        ${expHtml}
      </div>

      <div class="quiz-actions">
        <button class="btn" id="next-btn" ${item.answered?'':'disabled'}>${nextLabel}</button>
      </div>
    `;

    if(quiz.mode==='exam') updateTimerDisplay();

    app.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(item.answered) return;
        item.selected = parseInt(b.getAttribute('data-opt'),10);
        item.answered = true;
        renderQuiz();
      });
    });

    document.getElementById('next-btn').addEventListener('click', ()=>{
      if(isLast){ finishQuiz(false); }
      else { quiz.current++; renderQuiz(); }
    });

    document.getElementById('abandon').addEventListener('click', ()=>{
      if(confirm('¿Abandonar esta sesión? Se perderá el progreso.')) renderHome();
    });
  }

  // ---------------- FINISH / RESULTS ----------------
  function finishQuiz(timeUp){
    stopTimer();
    quiz.finished = true;
    quiz.timeUp = timeUp;
    renderResults();
  }

  function renderResults(){
    const items = quiz.items;
    const total = items.length;
    const correct = items.filter(it=>it.answered && it.selected===it.correct).length;
    const answered = items.filter(it=>it.answered).length;
    const pct = Math.round((correct/total)*100);

    let verdictHtml = '';
    if(quiz.mode==='exam'){
      const passed = correct>=71;
      verdictHtml = `<div class="verdict ${passed?'pass':'fail'}">${passed?'Aprobado':'No aprobado'}</div>
        <div class="score">Respondiste correctamente <b>${correct}</b> de ${total} preguntas (mínimo para aprobar: 71)</div>`;
    } else {
      verdictHtml = `<div class="verdict ${pct>=70?'pass':'fail'}">${pct}% de aciertos</div>
        <div class="score"><b>${correct}</b> correctas de ${total}</div>`;
    }

    const timeUpNote = quiz.timeUp ? `<p style="color:var(--bad);font-size:.85rem;">Se agotó el tiempo: las preguntas sin responder se contaron como incorrectas.</p>` : '';

    const reviewHtml = items.map((it,i)=>{
      const wasRight = it.answered && it.selected===it.correct;
      const userAnsText = it.answered ? it.opts[it.selected] : '(sin responder)';
      return `<div class="review-item ${wasRight?'right':'wrong'}">
        <div class="rq">${i+1}. ${it.qtext}</div>
        ${!wasRight ? `<div class="ra wrongline">Tu respuesta: ${userAnsText}</div>` : ''}
        <div class="ra correctline">Correcta: ${it.opts[it.correct]}</div>
        ${it.exp ? `<div class="ra">${it.exp}</div>` : ''}
      </div>`;
    }).join('');

    app.innerHTML = `
      <header class="top">
        <div class="mark">${quiz.title}</div>
      </header>

      <div class="result-hero">
        ${verdictHtml}
        <div class="result-bars">
          <div class="stat"><div class="n">${correct}</div><div class="l">Correctas</div></div>
          <div class="stat"><div class="n">${answered-correct}</div><div class="l">Incorrectas</div></div>
          <div class="stat"><div class="n">${total-answered}</div><div class="l">Sin responder</div></div>
          <div class="stat"><div class="n">${pct}%</div><div class="l">Porcentaje</div></div>
        </div>
        ${timeUpNote}
      </div>

      <div class="result-actions">
        <button class="btn secondary" id="back-home">Volver al inicio</button>
        <button class="btn" id="retry">Repetir con nuevas preguntas</button>
      </div>

      <div class="section-title">Repaso de preguntas</div>
      ${reviewHtml}

      <div class="result-actions">
        <button class="btn secondary" id="back-home-2">Volver al inicio</button>
      </div>
    `;

    document.getElementById('back-home').addEventListener('click', renderHome);
    document.getElementById('back-home-2').addEventListener('click', renderHome);
    document.getElementById('retry').addEventListener('click', ()=>{
      if(quiz.mode==='exam') startExam();
      else startTemaQuiz(quiz.temaId, total);
    });
  }

  renderHome();
})();

</script>
</body>
</html>
